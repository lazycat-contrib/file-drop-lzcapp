version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/file-drop.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: file-drop
build:
  run_buildscript: false
images:
  - id: file-drop
    target: service
    service: file-drop
    source: ghcr.io/besoeasy/originless
    channel: date
    sort: semver
    tag_regex: '^[0-9]{8}$'
    version_regex: '^(?P<version>[0-9]{4})(?P<month>[0-9]{2})(?P<day>[0-9]{2})$'
    version_template: '{version}.{month}.{day}'
    delivery:
      mode: mirror
stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: File Drop
    summary: "去中心化的开源文件分享解决方案"
